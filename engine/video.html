<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>launch-video</title>
<style>
  html, body { margin: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
  body.play { display: flex; align-items: center; justify-content: center; height: 100vh; }
  body.play canvas { max-width: 100vw; max-height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
/* Loads build/data.js (window.VIDEO), captures/<theme>/meta.js (window.CAPTURES), then core.js and scenes.js.
   window.ready resolves when every image and font is loaded: { total, warnings, format, theme }.
   window.seek(t) draws the frame at t seconds. Open with ?play to watch it in a browser (no audio). */
(function () {
  const qs = new URLSearchParams(location.search);
  const theme = qs.get('theme') === 'dark' ? 'dark' : 'light';
  const load = src => new Promise(res => { const s = document.createElement('script'); s.src = src; s.onload = () => res(true); s.onerror = () => res(false); document.head.appendChild(s); });
  let resolveReady; window.ready = new Promise(r => { resolveReady = r; });
  (async () => {
    if (!await load('../build/data.js')) { resolveReady({ total: 0, warnings: ['build/data.js missing: run python3 engine/build.py'] }); return; }
    const extra = [];
    if (VIDEO.googleFont) {
      const l = document.createElement('link'); l.rel = 'stylesheet';
      l.href = 'https://fonts.googleapis.com/css2?family=' + encodeURIComponent(VIDEO.googleFont).replace(/%20/g, '+') + ':wght@400;500;600;700;800&display=block';
      document.head.appendChild(l);
    }
    if (VIDEO.pages.some(p => p.url) && !await load(`../captures/${theme}/meta.js`)) extra.push(`captures/${theme}/meta.js missing: run node engine/capture.mjs --theme ${theme}`);
    await load('core.js'); await load('scenes.js');
    for (const w of extra) WARN.add(w);
    const jobs = [];
    // capture tiles
    const TILE = new RegExp('^captures/' + theme + '/[a-z0-9-]+(__typed)?-\\d+\\.png$');
    for (const [name, c] of Object.entries(CAPS)) c.tiles.forEach((tl, i) => { if (TILE.test(tl.src)) jobs.push(loadImg('cap:' + name + '#' + i, tl.src)); else WARN.add('ignored a capture tile outside captures/: ' + String(tl.src).slice(0, 60)); });
    // pages that use your own screenshot ("image"): one tile as tall as the picture
    for (const p of VID.pages.filter(p => p.image)) jobs.push(new Promise(res => {
      const im = new Image();
      im.onload = () => { const h = Math.round(im.naturalHeight * p.width / im.naturalWidth); CAPS[p.id] = { w: p.width, h, tiles: [{ src: p.image, y: 0, h }], boxes: {}, path: p.path }; IMG['cap:' + p.id + '#0'] = im; res(1); };
      im.onerror = () => { WARN.add('image failed to load: ' + p.image); res(0); }; im.src = '../' + p.image;
    }));
    // logos and pictures
    const logos = new Set();
    for (const l of [VID.product, VID.maker]) { if (l.logo) logos.add(l.logo); if (l.logoDark) logos.add(l.logoDark); }
    for (const sc of VID.scenes) {
      for (const l of [sc.show === 'logo' ? sc.src : null, sc.show === 'end' ? sc.logo : null]) if (l) { logos.add(l.light); logos.add(l.dark); }
      if (sc.src && (sc.show === 'image' || sc.show === 'numbers')) jobs.push(loadImg('img:' + sc.src, sc.src));
    }
    for (const l of logos) if (l) jobs.push(loadImg('logo:' + l, l));
    for (const sc of VID.scenes) if ((sc.show === 'page' || sc.show === 'phone') && !CAPS[sc.page] && !VID.pages.find(p => p.id === sc.page).image) WARN.add(`page ${sc.page} has no ${theme} capture: run node engine/capture.mjs`);
    await Promise.all(jobs);
    for (const sc of VID.scenes) if ((sc.show === 'page' || sc.show === 'phone') && !CAPS[sc.page]) WARN.add(`page ${sc.page} has no ${theme} capture`);
    await document.fonts.ready;
    // warm the fonts in every weight the engine uses, so the first frame measures text like the others
    for (const wgt of [500, 600, 700, 800]) { try { await document.fonts.load(`${wgt} 40px ${SANS}`); } catch (e) {} }
    window.seek = t => renderAt(t);
    // draw every scene once so text-fit warnings are collected before the render starts
    for (const sc of SCN) renderAt((sc.t0 + sc.t1) / 2);
    renderAt(0);
    resolveReady({ total: TOTAL, warnings: [...WARN], format: FORMAT, theme: THEME });
    if (qs.has('play')) {
      document.body.classList.add('play');
      const start = performance.now();
      const tick = () => { renderAt(((performance.now() - start) / 1000) % TOTAL); requestAnimationFrame(tick); };
      requestAnimationFrame(tick);
    }
  })();
})();
</script>
</body>
</html>
